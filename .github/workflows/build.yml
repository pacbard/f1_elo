name: Build GitHub Pages Website

on:
  push:
    branches:
    - main
  schedule:
  - cron: '0 0 * * 1'   # Run at 12:00 AM on Monday
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
    - name: Install the project
      run: uv sync --all-extras --dev
    - name: Run ETL scripts
      working-directory: etl/
      run: |
        uv run python etl.py
        uv run python calculate_elo.py
    - name: Upload data artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: database
        path: etl/f1db_local.duckdb

  build:
    needs: etl
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Fetch data artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: database
    - name: Move database to evidence directory
      run: mv f1db_local.duckdb etl/
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - name: Install dependencies
      working-directory: evidence/
      run: npm install
    - name: Run Evidence sources
      working-directory: evidence/
      run: npm exec evidence sources
    - name: Build Evidence project
      working-directory: evidence/
      run: npm exec evidence build
    - name: Deploy to GitHub Pages
      uses: 
        actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
      with:
        path: 'evidence/build/'

  publish:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
